server {
    listen       80 default_server;
    server_name  localhost;

    # 静态文件根目录（所有 location 继承）
    root   /usr/share/nginx/html;
    index  index.html index.htm;

    add_header Content-Security-Policy "
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval';
        style-src 'self' 'unsafe-inline';
        img-src 'self' data: blob:;
        font-src 'self';
        connect-src 'self';
        object-src 'none';
        frame-ancestors 'none';
        base-uri 'self';
    " always;

    gzip on;
    gzip_min_length 1k;
    gzip_buffers 4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 2;
    gzip_types text/plain application/x-javascript text/css application/xml application/javascript application/json;
    gzip_proxied any;

    # 👉 1. index.html：不要长缓存（每次发布都要让浏览器拿新版本）
    location = /index.html {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    # 👉 2. SPA 路由入口
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 👉 3. 静态资源：JS / CSS / 图片 / 字体 长缓存（文件名带 hash 时非常安全）
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # 👉 4. API 代理
    location /api/ {
        proxy_pass http://istio_gw/;
        # proxy_pass http://k8s-istiosys-istioing-d567563864-ac5e2a3c763d6adc.elb.us-east-1.amazonaws.com:30588/;
        proxy_http_version 1.1;

        proxy_set_header Host iot.com;
        # proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;

        proxy_buffering off;  # 关闭缓冲，让数据一到就往外推
    }

    # 👉 5. WebSocket 代理
    location /api/register-app/socket/ {
        proxy_pass http://k8s-istiosys-istioing-d567563864-ac5e2a3c763d6adc.elb.us-east-1.amazonaws.com:30588/register-app/socket/;
        proxy_http_version 1.1;

        # WebSocket 和长轮询必需的头部
        proxy_set_header Host iot.com;
        # proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # 禁用缓冲，确保实时通信
        proxy_buffering off;

        # 增加超时设置
        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
}
