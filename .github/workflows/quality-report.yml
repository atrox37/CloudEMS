name: Code Quality Report

on:
  pull_request:
  push:
    branches:
      - ddd
  workflow_dispatch:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run quality report
        id: quality
        run: pnpm quality:report -- --out quality-report.md
        continue-on-error: true

      - name: Publish workflow summary
        if: always()
        shell: bash
        run: cat quality-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-report
          path: |
            quality-report.md
            coverage

      - name: Comment report on PR
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/github-script@v7
        env:
          REPORT_PATH: quality-report.md
        with:
          script: |
            const fs = require('fs')
            const body = fs.readFileSync(process.env.REPORT_PATH, 'utf8')
            const marker = '<!-- code-quality-report -->'
            const fullBody = `${marker}\n${body}`
            const { owner, repo } = context.repo
            const issue_number = context.payload.pull_request.number
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number,
              per_page: 100,
            })
            const existing = comments.data.find((comment) => comment.body.includes(marker))
            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body: fullBody,
              })
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: fullBody,
              })
            }

      - name: Fail if checks failed
        if: steps.quality.outcome != 'success'
        run: exit 1
